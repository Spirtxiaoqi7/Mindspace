# Mindspace low-bandwidth runtime map.
# Keep large third-party archives off douyinqijun.cn and redirect clients to
# their authoritative upstream release assets.

location = /downloads/mindspace/runtime/PowerShell-7.6.3-win-x64.zip {
    add_header Cache-Control "public, max-age=300" always;
    return 302 https://github.com/PowerShell/PowerShell/releases/download/v7.6.3/PowerShell-7.6.3-win-x64.zip;
}

location = /downloads/mindspace/runtime/MinGit-2.53.0-64-bit.zip {
    add_header Cache-Control "public, max-age=300" always;
    return 302 https://github.com/git-for-windows/git/releases/download/v2.53.0.windows.1/MinGit-2.53.0-64-bit.zip;
}

location = /downloads/mindspace/runtime/uv-x86_64-pc-windows-msvc-0.11.26.zip {
    add_header Cache-Control "public, max-age=300" always;
    return 302 https://github.com/astral-sh/uv/releases/download/0.11.26/uv-x86_64-pc-windows-msvc.zip;
}

location ~ ^/downloads/mindspace/python/(.+)$ {
    add_header Cache-Control "public, max-age=300" always;
    return 302 https://github.com/astral-sh/python-build-standalone/releases/download/$1;
}
