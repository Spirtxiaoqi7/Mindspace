name: 0.9.0 quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-version-consistency.mjs
      - run: node scripts/sync-gpt-sovits-catalog.mjs --check
      - run: node scripts/generate-codebase-index.mjs
      - run: node scripts/verify-current-doc-paths.mjs
      - run: node scripts/verify-repository-policy.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run lint-imports
      - run: uv run python scripts/export-api-contracts.py --check
      - run: uv run pytest -q tests/test_api_route_contract.py
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run check
      - run: node scripts/verify-frontend-boundaries.mjs
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - run: node scripts/verify-repository-policy.mjs

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - working-directory: desktop
        run: npm ci
      - working-directory: desktop
        run: npm test
      - working-directory: desktop
        run: npm run check
      - run: node scripts/verify-cjs-syntax.mjs
      - shell: pwsh
        run: ./scripts/verify-powershell-syntax.ps1
      - shell: pwsh
        run: ./scripts/build-update.ps1 -Version 0.9.0 -SkipBuild -DryRun
